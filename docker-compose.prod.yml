version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: ai-agent-frontend:latest
    restart: unless-stopped
  agent-core:
    build:
      context: ./services/agent-core
      dockerfile: Dockerfile.prod
    image: ai-agent-core:latest
    environment:
      - LEDGER_SERVICE_URL=http://ledger:8000
    restart: unless-stopped
  retrieval:
    build:
      context: ./services/retrieval
      dockerfile: Dockerfile.prod
    image: ai-agent-retrieval:latest
    restart: unless-stopped
  ledger:
    build:
      context: ./services/ledger-service
      dockerfile: Dockerfile.prod
    image: ai-agent-ledger:latest
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - "8003:8003"
    - "8002:8002"
    - "8000:8000"
      - "80:80"
    depends_on:
      - frontend
      - agent-core
      - retrieval
      - ledger

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile.prod
    image: ai-agent-orchestrator:latest
    ports:
      - "8010:8000"
    restart: unless-stopped
