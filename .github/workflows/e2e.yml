
name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright deps
        run: npx playwright install --with-deps
      - name: Run tests
        env:
          BASE_URL: http://localhost:8000
        run: npx playwright test
