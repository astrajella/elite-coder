name: Build and Push Docker images
on: [push]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-agent-frontend:latest
      - name: Build and push agent-core
        uses: docker/build-push-action@v4
        with:
          context: ./services/agent-core
          file: ./services/agent-core/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-agent-core:latest
      - name: Build and push retrieval
        uses: docker/build-push-action@v4
        with:
          context: ./services/retrieval
          file: ./services/retrieval/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-agent-retrieval:latest
      - name: Build and push ledger
        uses: docker/build-push-action@v4
        with:
          context: ./services/ledger-service
          file: ./services/ledger-service/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-agent-ledger:latest
